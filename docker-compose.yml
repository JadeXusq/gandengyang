# 干瞪眼 - 生产部署（腾讯云 Lighthouse / Docker CE）
# 端口规划：与捡红点（80 / 2567）共存于同一实例，本应用使用 8080（前端）/ 2568（游戏服）
services:
  # 游戏服务器（Colyseus + Express，容器内 2567，宿主机 2568）
  server:
    build: .
    container_name: gdy-server
    restart: unless-stopped
    ports:
      - "2568:2567"
    environment:
      NODE_ENV: production
      PORT: "2567"

  # 前端静态站点（Vite 构建产物 client/dist，宿主机 8080）
  web:
    image: nginx:alpine
    container_name: gdy-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./client/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
